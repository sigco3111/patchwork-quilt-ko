<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>패치워크 퀼트</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1c1714; overflow: hidden; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e8cfa4; font: 15px/1.4 Georgia, 'Noto Serif KR', 'Apple SD Gothic Neo', 'Malgun Gothic', serif; letter-spacing: 0.08em; }
      #hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: #f3e3c3; font: 14px/1.4 Georgia, 'Noto Serif KR', 'Apple SD Gothic Neo', 'Malgun Gothic', serif; letter-spacing: 0.04em;
        background: rgba(28, 20, 18, 0.55); padding: 8px 16px; border-radius: 3px; transition: opacity 2s; pointer-events: none; white-space: nowrap; }
      #hint.faded, #mode.faded { opacity: 0; }
      #mode { position: fixed; left: 50%; top: 26px; transform: translateX(-50%); color: #f3e3c3; font: 14px/1.4 Georgia, 'Noto Serif KR', 'Apple SD Gothic Neo', 'Malgun Gothic', serif; letter-spacing: 0.04em;
        background: rgba(28, 20, 18, 0.55); padding: 8px 16px; border-radius: 3px; transition: opacity 0.6s; pointer-events: none; white-space: nowrap; }
      #hint.off { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="loading">천을 자르는 중</div>
    <div id="hint">클릭해서 둘러보기 · WASD 이동 · Shift 달리기 · Space 점프 · 휠로 물러나기 · P 인형 포즈 속도</div>
    <div id="mode" class="faded"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
